name: Sync Matches

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-matches cron
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXT_PUBLIC_URL }}/api/cron/sync-matches")
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$response" | sed '$d'
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Cron returned $code"
            exit 1
          fi

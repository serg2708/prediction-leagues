name: Finalise Leagues

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger finalise-leagues cron
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXT_PUBLIC_URL }}/api/cron/finalise-leagues")
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$response" | sed '$d'
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Cron returned $code"
            exit 1
          fi

name: Notify Upcoming Matches

on:
  schedule:
    # Hourly — the route's [+30, +90) min window partitions cleanly across
    # hourly runs so every match gets exactly one nudge sweep.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notify-upcoming cron
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXT_PUBLIC_URL }}/api/cron/notify-upcoming")
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$response" | sed '$d'
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Cron returned $code"
            exit 1
          fi
